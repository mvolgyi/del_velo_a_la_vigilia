name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Construir contenido y compilar packs
        run: |
          npm run contenido
          npm run guia
          npm run verificar || true
          for p in reservas mejoras estados rasgos arsenal reglas cronica personajes escenas macros playlists aventura; do
            npx fvtt package pack "$p" --id del-velo-a-la-vigilia --type Module --in "packs-src/$p" --out packs
          done

      - name: Fijar versión y download en module.json
        run: node tools/release.mjs "${GITHUB_REF_NAME}"

      - name: Empaquetar
        run: |
          zip -r module.zip module.json README.md LICENSE src lang templates content packs assets guia \
            -x "content/muros/*" "assets/mapas/*.svg" "*.DS_Store"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
